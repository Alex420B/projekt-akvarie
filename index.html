<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>storcenter-nord</title>

    <link rel="stylesheet" href="/projekt-akvarie/css/style.css">
</head>
<body>
 
    
<header class="flag-container">
<img src="img/denmark-Picsart-BackgroundRemover.webp" alt="Dansk flag">
<img src="img/germany-Picsart-BackgroundRemover.webp" alt="Tysk flag">
<img src="img/Firefly_RemoveBackground.png" alt="Engelsk flag">
</header>

  <main class="akvarie">
        <img class=" fisk fisk1" src="/projekt-akvarie/img/dory .svg" alt="Fisk1">
        <img class=" fisk fisk2" src="/projekt-akvarie/img/puffer 2.svg" alt="Fisk2">
        <img class=" fisk fisk3" src="/projekt-akvarie/img/SHARK.svg" alt="Fisk3">
        <img class=" fisk fisk4" src="/projekt-akvarie/img/søhest 5.gif" alt="Fisk4">
        <img class="fisk fisk5" src="/projekt-akvarie/img/nemo.gif" alt="Fisk5">
  </main>

<p class="skilt-tekst"> TRYK <br> PÅ EN FISK!</p>

<section id="popup" hidden aria-labelledby="popup-title">
  <button id="popup-close" type="button" aria-label="Close popup">×</button>
  <h2 id="popup-title">Fordre mig</h2>
  <img id="popup-fish" src="vid/popup.svg" alt="popup-fish">

  <div id="food-container">
    <div class="food" draggable="true" data-type="correct">🦐 Reje</div>
    <div class="food" draggable="true" data-type="wrong">🍞 Brød</div>
    <div class="food" draggable="true" data-type="wrong">🍫 Chokolade</div>
  </div>

  <p id="status"></p>
</section>


<footer class="logo-section">

    <img class="logo" src="img/logo.png" alt=" storecenter nord logo">

</footer>

    
<section>
    <h2></h2>
    <p></p>



    <script src="/projekt-akvarie/js/script.js"></script>
</body>
</html>
